# NR-MC 控制台 —— Nginx 設定
#
# 職責：
#   1. 提供 Flutter Web 靜態檔（/usr/share/nginx/html）
#   2. 把 /api/ 轉發給 Flask 後端（127.0.0.1:8080）
#   3. 把 /ws/ 轉發給 Flask 後端（WebSocket）
#
# ★ 為什麼要自己寫 nginx.conf 而不用 HA Add-on 預設的？
#   HA Add-on 預設的模板沒有 /ws/ 的 WebSocket 支援，
#   而且預設會把靜態檔放在 /share 而非映像內。
#   自己寫完全可控，也比較好除錯。

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 記錄到 stdout，方便在 HA 的 Add-on Log 面板查看
    access_log  /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # 上傳大小限制（本專案用不到，但保持合理值）
    client_max_body_size 10m;

    # 壓縮文字檔，減少傳輸量
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml;

    # ★ 關鍵：HA Ingress 會把外部路徑轉成內部路徑。
    #   當外部請求是 /api/hassio_ingress/<token>/nrmc_panel/api/devices
    #   時，Supervisor 會剝掉前綴，實際送到容器的是 /api/devices。
    #   因此這裡不需要處理 ingress 前綴，路徑對應即可。
    # 容器內的後端（upstream 必須放在 http 層，不能塞在 server 裡）
    upstream nrmc_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen  8099;
        listen  [::]:8099;

        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- WebSocket：狀態即時推播 ---
        # ★ 必須有 Upgrade/Connection 標頭，
        #   否則 nginx 會把 WebSocket 當成一般 HTTP 請求而失敗。
        location /ws {
            proxy_pass         http://nrmc_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket 連線是長連線，不要設短 timeout
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }

        # --- API：Flask 後端 ---
        location /api/ {
            proxy_pass         http://nrmc_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";

            # AT 指令查詢會有延遲（真實設備可達 0.6 秒以上），
            # 網段掃描更久，所以 timeout 給寬一點
            proxy_connect_timeout  10s;
            proxy_read_timeout     120s;
            proxy_send_timeout     120s;
        }

        # --- 靜態檔 ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Flutter web 產生的 .js / .wasm，長期快取
        location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # index.html 不快取，確保更新後前端立即生效
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }

        # 健康檢查（HA Supervisor 會用）
        location = /health {
            proxy_pass http://nrmc_backend/api/health;
            access_log off;
        }
    }
}
