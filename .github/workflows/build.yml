name: Build Docker Image

# 當 Dockerfile 或原始碼有變更時自動建置映像
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'backend/**'
      - 'frontend/**'
      - 'nrmc_panel/**'
      - '.github/workflows/build.yml'
  # 讓你可以在網頁上按按鈕手動觸發
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nrmc-panel

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # 各架構平行建置，失敗時不影響其他架構
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base:3.19
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base:3.19
          - arch: armv7
            base: ghcr.io/home-assistant/armv7-base:3.19
          - arch: armhf
            base: ghcr.io/home-assistant/armhf-base:3.19
          - arch: i386
            base: ghcr.io/home-assistant/i386-base:3.19

    steps:
      # --- 1. 取出程式碼 ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 2. 登入 GitHub Container Registry ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. 設定 Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 4. 計算映像標籤 ---
      #
      # ★ 為什麼要按架構分開推？
      #   HA 的 config.yaml 寫的是 image: ghcr.io/<user>/nrmc-panel-{arch}
      #   Supervisor 會把 {arch} 換成主機的架構（amd64/aarch64/...），
      #   並把 config.yaml 的 version 當成 tag 來拉：
      #     ghcr.io/<user>/nrmc-panel-aarch64:1.0.0
      #   所以每個架構都一定要有「:版本號」這個 tag，否則就是 404 manifest unknown。
      #   版本號改了（config.yaml 的 version），這裡也要同步改。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}
          tags: |
            type=raw,value=1.0.0
            type=raw,value=latest,enable={{is_default_branch}}

      # --- 5. 建置並推送 ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            FLUTTER_VERSION=3.47.7
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # --- 6. 輸出映像資訊 ---
      - name: Summary
        run: |
          echo "### 映像已推送" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
